[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-plaid"
version = "1.0.0"
description = "A Model Context Protocol server for Plaid integration development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Fabian Athayde", email = "fabianathaydesr2@gmail.com"}
]
keywords = ["plaid", "mcp", "model-context-protocol", "ai", "coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "plaid-python>=20.0.0",
    "mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/fabianathaydesr2/ai-coding-toolkit"
Repository = "https://github.com/fabianathaydesr2/ai-coding-toolkit"
Documentation = "https://github.com/fabianathaydesr2/ai-coding-toolkit/blob/main/README.md"
Issues = "https://github.com/fabianathaydesr2/ai-coding-toolkit/issues"

[tool.setuptools]
packages = ["mcp_server_plaid"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
